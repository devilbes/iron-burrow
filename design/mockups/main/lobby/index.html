<!doctype html>
<html lang="en" data-window="lobby">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iron Burrow — Lobby</title>
<link rel="stylesheet" href="../../shared.css">
<style>
#screen{min-height:100svh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lobby-header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px 32px;z-index:1}
.lobby-brand{font-family:var(--font-display,'Russo One',sans-serif);font-size:24px;letter-spacing:.035em;white-space:nowrap}
.lobby-nav{display:grid;grid-template-columns:repeat(4,minmax(88px,1fr));gap:8px}
.lobby-nav>div{min-width:0}
.lobby-content{flex:1;display:grid;grid-template-columns:55% 45%;align-items:center;min-height:0}
.lobby-hero{margin:0;height:100%;min-height:500px;position:relative;display:flex;align-items:center}
.lobby-hero img{width:100%;height:100%;object-fit:cover;object-position:38% center;position:absolute;inset:0;mask-image:linear-gradient(90deg,#000 85%,transparent)}
.lobby-hero figcaption{position:absolute;left:32px;right:32px;bottom:32px;font-size:16px;color:#CFE6E8;max-width:500px}
.lobby-actions{padding:40px 64px 64px 40px;max-width:620px;display:flex;flex-direction:column;gap:24px}
.lobby-eyebrow{font-size:14px;letter-spacing:.15em;text-transform:uppercase;color:#6FC2C4}
.lobby-actions h1{margin:0;font-family:var(--font-display,'Russo One',sans-serif);font-size:64px;line-height:1.03}
.lobby-actions .chapter{color:#8FA3B0;margin:0;font-size:20px}
.lobby-buttons{display:flex;flex-direction:column;gap:12px}
.lobby-buttons>div{width:100%}
.lobby-progress{display:flex;align-items:baseline;gap:12px}
.lobby-progress strong{font-size:32px;font-family:var(--font-display,'Russo One',sans-serif);color:#FFC845}
.lobby-progress span{color:#8FA3B0;font-size:14px}
.lobby-stage{font-size:16px;color:#CFE6E8;margin:0}
@media (min-width:600px) and (max-height:550px){
.lobby-header{padding:12px 20px;gap:20px}
.lobby-brand{font-size:18px}
.lobby-nav{grid-template-columns:repeat(4,minmax(75px,1fr))}
.lobby-content{grid-template-columns:55% 45%}
.lobby-hero{min-height:0}
.lobby-hero figcaption{font-size:14px;bottom:16px;left:20px;right:20px}
.lobby-actions{padding:8px 24px 16px 16px;gap:12px}
.lobby-actions h1{font-size:38px}
.lobby-actions .chapter{font-size:16px}
.lobby-eyebrow{display:none}
.lobby-progress strong{font-size:24px}
.lobby-buttons{gap:8px}
}
@media (max-aspect-ratio:4/5){
.lobby-header{padding:16px 16px 0;display:block}
.lobby-brand{font-size:20px;margin-bottom:16px}
.lobby-nav{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lobby-content{display:flex;flex-direction:column;align-items:stretch}
.lobby-hero{margin:0;min-height:260px;flex:1}
.lobby-hero img{mask-image:linear-gradient(#000 75%,transparent);object-position:38% center}
.lobby-hero figcaption{display:none}
.lobby-actions{padding:0 24px 28px;gap:16px;text-align:center;max-width:none}
.lobby-actions h1{font-size:40px}
.lobby-eyebrow{font-size:12px}
.lobby-actions .chapter{font-size:16px}
.lobby-progress{justify-content:center;order:4}
.lobby-progress strong{font-size:24px}
.lobby-stage{font-size:14px}
}
</style>
</head>
<body><main id="screen"></main>
<script type="module">
import {button,boot,t} from '../../shared.mjs';
const app=await boot('lobby');const screen=app.root;
screen.innerHTML=`<header class="lobby-header"><div class="lobby-brand">${t('ui.lobby.title')}</div><nav class="lobby-nav" aria-label="Services"><div data-part="topbar-daily"></div><div data-part="topbar-shop"></div><div data-part="topbar-leaderboards"></div><div data-part="topbar-settings"></div></nav></header>
<div class="lobby-content"><figure class="lobby-hero"><img src="/assets/ui/screens/lobby.png" alt="The teal Burrower drill tank guards the warm amber Core in its steel hangar"><figcaption>${t('story.ch1.intro.line')}</figcaption></figure>
<section class="lobby-actions" aria-label="Campaign"><div class="lobby-eyebrow">${t('ui.map.title')}</div><h1>${t('ui.lobby.title')}</h1><p class="chapter">${t('ui.map.chapter_1')}</p><p class="lobby-stage">${t('ui.lobby.play_sub').replace('{n}','7')}</p><div class="lobby-buttons"><div data-part="lobby-play" data-cta="primary"></div><div data-part="lobby-siege" data-state="open"></div></div><div class="lobby-progress" data-part="lobby-stars"><strong><img src="/assets/ui/icons/rating-star.png" alt="Stars" style="width:24px;height:24px"> ${t('ui.lobby.stars').replace('{stars}','16')}</strong><span>${t('ui.map.title')}</span></div></section></div>`;
for(const [part,key] of [['daily','ui.topbar.daily'],['shop','ui.topbar.shop'],['leaderboards','ui.topbar.leaderboards'],['settings','ui.topbar.settings']])await button(screen.querySelector('[data-part="topbar-'+part+'"]'),t(key),{});
await button(screen.querySelector('[data-part="lobby-play"]'),t('ui.lobby.play'),{primary:true,onclick:()=>location.href='../stage-map/index.html'});
await button(screen.querySelector('[data-part="lobby-siege"]'),t('ui.lobby.siege'),{onclick:()=>location.href='../game/index.html'});
await boot.finish();
</script></body></html>
