<!doctype html>
<html lang="en" data-window="stage-map"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iron Burrow — Campaign</title><link rel="stylesheet" href="../../shared.css"><style>
#screen{display:grid;grid-template:80px 1fr 100px / 230px 1fr 260px;gap:24px;padding:32px;background-image:url('../../../../assets/ui/screens/stage-map.png');background-size:cover;background-position:center;min-height:100svh;box-sizing:border-box}
.map-header{grid-column:1/-1;display:flex;align-items:center;gap:24px}.map-header h1{margin:0}.map-header .total{margin-left:auto;color:#FFC845;font-size:24px}.chapters{display:flex;flex-direction:column;gap:16px;align-self:center}.chapter-slot{display:flex;flex-direction:column;gap:6px}.chapter-slot small{color:#8FA3B0;padding-left:12px}.map-content{grid-column:2/4;position:relative;display:flex;align-items:center;justify-content:center}.map-caption{position:absolute;top:8px;left:24px}.map-caption h2{font-size:32px;margin:0 0 8px}.map-caption p{color:#8FA3B0;margin:0}.nodes{position:relative;width:min(92%,850px);height:280px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);align-items:center;gap:32px 20px}.nodes:before{content:'';position:absolute;left:8%;right:8%;height:140px;border-top:3px dashed #6FC2C4;border-right:3px dashed #6FC2C4;border-bottom:3px dashed #2F4558;z-index:0}.node{z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px}.node [data-kit-host]{width:72px}.node .stars{height:20px;color:#FFC845;font-size:16px;letter-spacing:3px}.node:nth-child(6){grid-column:5;grid-row:2}.node:nth-child(7){grid-column:4;grid-row:2}.node:nth-child(8){grid-column:3;grid-row:2}.node:nth-child(9){grid-column:2;grid-row:2}.node:nth-child(10){grid-column:1;grid-row:2}.map-footer{grid-column:2/4;display:flex;justify-content:flex-end;align-items:center;gap:24px}.selected-copy{line-height:1.5}.selected-copy strong{display:block;color:#F2F6F7;font-size:24px}.selected-copy small{color:#8FA3B0}.play-slot{min-width:230px}
@media(min-width:700px) and (max-height:550px){#screen{grid-template:48px 1fr 64px / 152px 1fr 180px;padding:12px;gap:8px}.map-header h1{font-size:24px}.map-header .total{font-size:18px}.chapters{gap:8px}.chapter-slot small{font-size:11px}.map-caption{top:0;left:8px}.map-caption h2{font-size:20px;margin:0}.map-caption p{font-size:13px}.nodes{height:168px;margin-top:34px;gap:8px}.nodes:before{height:84px}.node{gap:2px}.node [data-kit-host]{width:58px}.node .stars{font-size:12px;height:14px}.map-footer{gap:16px}.selected-copy strong{font-size:18px}.play-slot{min-width:180px}}
@media(max-width:699px){#screen{display:grid;grid-template:54px 122px 1fr 104px / 1fr;gap:12px;padding:16px}.map-header{grid-column:1;gap:12px}.map-header h1{font-size:24px}.map-header .total{font-size:18px}.chapters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-self:start}.chapter-slot small{display:none}.map-content{grid-column:1}.map-caption{top:0;left:8px}.map-caption h2{font-size:24px}.map-caption p{font-size:14px}.nodes{width:240px;height:100%;max-height:430px;margin-top:32px;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);gap:2px 32px}.nodes:before{left:25%;right:25%;top:10%;bottom:10%;height:auto;border:0;border-left:3px dashed #6FC2C4;border-right:3px dashed #2F4558}.node{gap:0}.node [data-kit-host]{width:64px}.node .stars{font-size:12px;height:15px}.node:nth-child(1){grid-area:1/1}.node:nth-child(2){grid-area:1/2}.node:nth-child(3){grid-area:2/2}.node:nth-child(4){grid-area:2/1}.node:nth-child(5){grid-area:3/1}.node:nth-child(6){grid-area:3/2}.node:nth-child(7){grid-area:4/2}.node:nth-child(8){grid-area:4/1}.node:nth-child(9){grid-area:5/1}.node:nth-child(10){grid-area:5/2}.map-footer{grid-column:1;gap:12px;align-items:center}.selected-copy strong{font-size:18px}.selected-copy small{font-size:12px}.play-slot{min-width:180px}}
@media(max-width:699px){#screen{grid-template-rows:54px 72px 1fr 104px}.nodes{height:340px;max-height:none;margin-top:64px}.map-caption p{margin-top:4px}}
</style></head><body><main id="screen"></main><script type="module">
import {boot,button,t} from '../../shared.mjs';
const app=await boot('stage-map');
app.root.innerHTML=`<header class="map-header"><div id="back"></div><h1>${t('ui.map.title')}</h1><span class="total"><img src="/assets/ui/icons/rating-star.png" width="20" height="20" alt="Stars"> 16 / 90</span></header><nav class="chapters" aria-label="Chapters"></nav><section class="map-content"><div class="map-caption"><h2>${t('ui.map.chapter_1')}</h2><p>Chapter 1 · Stages 1–10</p></div><div class="nodes" aria-label="Stage selection"></div></section><footer class="map-footer"><div class="selected-copy"><strong>Stage 7</strong><small>Protect the Burrow Core</small></div><div class="play-slot"></div></footer>`;
button(app.root.querySelector('#back'),t('ui.common.back'),{onclick:()=>location.href='../lobby/'});
for(let i=1;i<=3;i++){const slot=document.createElement('div');slot.className='chapter-slot';slot.dataset.part='chapter-tab';slot.dataset.state=i===1?'open':'locked';app.root.querySelector('.chapters').append(slot);button(slot,t(`ui.map.chapter_${i}`),{disabled:i!==1});if(i>1){const hint=document.createElement('small');hint.textContent=`Clear stage ${i===2?10:20} to open`;slot.append(hint)}}
for(let i=1;i<=10;i++){const node=document.createElement('div');node.className='node';node.dataset.part='stage-node';node.dataset.state=i<7?'cleared':i===7?'open':'locked';node.dataset.stars=i<5?'3':i<7?'2':'0';const host=document.createElement('div');node.append(host);button(host,String(i),{disabled:i>7,onclick:()=>{app.root.querySelector('.selected-copy strong').textContent=`Stage ${i}`}});const stars=document.createElement('span');stars.className='stars';if(i<7){stars.innerHTML=Array.from({length:i<5?3:2},()=>'<img src="/assets/ui/icons/rating-star.png" width="14" height="14" alt="Star">').join('')}else stars.textContent=i===7?'NOW':'Locked';node.append(stars);app.root.querySelector('.nodes').append(node)}
button(app.root.querySelector('.play-slot'),t('ui.map.play',{n:7}),{primary:true,onclick:()=>location.href='../game/'});
await app.finish();
</script></body></html>
