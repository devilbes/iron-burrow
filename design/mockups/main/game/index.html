<!doctype html>
<html lang="en" data-window="game">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Iron Burrow — Stage 7</title><link rel="stylesheet" href="../../shared.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}#screen{--field:min(858px,calc(100svh - 32px),calc(100vw - 480px));box-sizing:border-box;min-height:100svh;height:100svh;display:grid;grid-template-columns:minmax(160px,1fr) var(--field) minmax(160px,1fr);gap:16px;align-items:center;padding:16px;background:#0A1118}.status{display:flex;flex-direction:column;gap:32px;padding:0 24px;max-width:240px;justify-self:end;width:100%;box-sizing:border-box}.stage-label{margin:0;color:#8FA3B0;font-size:14px;letter-spacing:2px}.stage-value{font:400 40px/1.1 'Russo One',sans-serif;margin:4px 0 0;color:#F2F6F7}.stats{margin:0;display:grid;gap:24px}.stat{display:grid;gap:4px}.stat dt{color:#8FA3B0;font-size:12px;letter-spacing:1px}.stat dd{margin:0;font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}.core-note{font-size:14px;color:#FFC845;margin:0}.arena{margin:0;width:var(--field);height:var(--field);position:relative}.arena img{display:block;width:100%;height:100%;object-fit:cover}.controls{display:flex;flex-direction:column;gap:24px;padding:0 24px;width:100%;max-width:270px;box-sizing:border-box;justify-self:start}.fire [data-kit-host]{min-height:64px}.boosters{display:grid;gap:8px}.movement{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.movement .up{grid-column:2}.movement .left{grid-row:2;grid-column:1}.movement .down{grid-row:2;grid-column:2}.movement .right{grid-row:2;grid-column:3}.move-caption,.keyboard{margin:0;color:#8FA3B0;font-size:12px;text-align:center}.move-caption{letter-spacing:1px;margin-bottom:8px}.action-group{display:grid;gap:8px}.pause{max-width:160px}.keyboard{line-height:1.5}.boosters [data-kit-host]{width:100%}
@media(min-width:700px) and (max-height:550px){#screen{--field:calc(100svh - 16px);padding:8px;gap:8px;grid-template-columns:minmax(144px,1fr) var(--field) minmax(176px,1fr)}.status{padding:0 16px;gap:16px}.stage-value{font-size:32px}.stats{gap:16px}.stat dd{font-size:24px}.stat dt{font-size:11px}.controls{padding:0 8px;gap:8px}.movement{gap:2px}.move-caption,.keyboard{display:none}.fire [data-kit-host]{min-height:48px}.boosters{gap:4px;grid-template-columns:1fr}.action-group{gap:4px}.core-note{font-size:12px}.stage-label{font-size:12px}}
@media(max-width:699px){#screen{--field:100vw;display:grid;grid-template-columns:1fr;grid-template-rows:48px 100vw 1fr;padding:0;gap:0;align-items:start}.status{display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:8px;max-width:none;padding:0 12px;height:48px;justify-self:stretch}.stage-head{display:flex;align-items:center;gap:5px}.stage-label{font-size:14px;letter-spacing:0}.stage-value{font:700 20px/1 'Exo 2',sans-serif;margin:0}.stats{display:flex;gap:14px}.stat{gap:0;text-align:center}.stat dt{font-size:14px;letter-spacing:0}.stat dd{font-size:18px;line-height:1.2}.core-note,.status .pause{display:none}.controls{padding:20px 16px 16px;max-width:none;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-self:stretch;align-content:center}.movement-group{grid-column:1;grid-row:1/3;align-self:center}.movement{gap:6px}.movement .up{grid-row:1}.fire{grid-column:2}.boosters{grid-column:1/-1;grid-row:3;grid-template-columns:repeat(3,1fr);gap:8px}.pause-mobile{grid-column:2;grid-row:2}.keyboard{display:none}.move-caption{text-align:left;margin-bottom:12px}.action-group{display:contents}.fire [data-kit-host]{min-height:64px}.boosters [data-kit-host]{min-width:0}}
@media(min-width:700px){.pause-mobile{display:none}}
@media(max-width:699px){.controls{align-content:start;padding-top:16px;gap:16px}.move-caption{display:none}.boosters{--preview-control-height:64px}}
</style></head>
<body><main id="screen"></main><script type="module">
import {boot,button,t} from '../../shared.mjs';
const app=await boot('game');
app.root.innerHTML=`<aside class="status" aria-label="Stage status"><div class="stage-head"><p class="stage-label">${t('ui.game.stage')}</p><h1 class="stage-value">07</h1></div><dl class="stats"><div class="stat"><dt>${t('ui.game.enemies')}</dt><dd>12</dd></div><div class="stat"><dt>${t('ui.game.lives')}</dt><dd>2</dd></div><div class="stat"><dt>${t('ui.game.score')}</dt><dd>1,840</dd></div></dl><p class="core-note">${t('ui.game.protect')}</p><div class="pause"></div></aside><figure class="arena"><img src="../../../../assets/ui/screens/game.png" alt="Top-down battle: the teal Burrower protects the amber Core from three rusty beetle tanks in a destructible maze."></figure><aside class="controls" aria-label="Game controls"><div class="movement-group"><p class="move-caption">${t('ui.game.move')}</p><div class="movement"><div class="up"></div><div class="left"></div><div class="down"></div><div class="right"></div></div></div><div class="action-group"><div class="fire"></div><div class="pause-mobile"></div><div class="boosters"><div class="shield"></div><div class="shockwave"></div><div class="fortress"></div></div></div><p class="keyboard">${t('ui.game.keyboard')}</p></aside>`;
const $=s=>app.root.querySelector(s);
button($('.fire'),t('ui.game.fire'),{primary:true});
button($('.pause'),t('ui.game.pause'));
button($('.pause-mobile'),t('ui.game.pause'));
for(const [selector,label] of [['.up','Up'],['.left','Left'],['.down','Down'],['.right','Right']])button($(selector),label);
for(const name of ['shield','shockwave','fortress'])button($('.'+name),t('ui.game.'+name));
await app.finish();
</script></body></html>
