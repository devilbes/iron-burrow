<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title></title>
    <!-- #boot-loader: the neutral loading line along the top edge, full width, from the first paint until the game's loading
         screen (#preloader, src/boot/start.ts) has painted; inline only, no requests, no colors
         of a skin. The build writes the title and the language. -->
    <style>
      html,body{height:100%;margin:0;background:#0e0e10;color:#d6d6d6;font:16px system-ui,sans-serif}
      #app{position:fixed;inset:0}
      #preloader{position:fixed;inset:0;z-index:10}
      #preloader[hidden],#boot-loader[hidden]{display:none}
      #boot-loader{position:fixed;inset:0;z-index:20;background:#0e0e10}
      #boot-loader>i{position:absolute;top:0;left:0;width:100%;height:3px;overflow:hidden;background:rgba(255,255,255,.08)}
      #boot-loader>i::after{content:'';position:absolute;inset:0 auto 0 0;width:30%;background:rgba(255,255,255,.75);
        animation:boot-line 1.2s ease-in-out infinite}
      @keyframes boot-line{from{transform:translateX(-100%)}to{transform:translateX(334%)}}
      @media (prefers-reduced-motion:reduce){#boot-loader>i::after{animation:none;width:100%;opacity:.4}}
    </style>
    <!-- importmap -->
    <script type="module" src="./app/main.js"></script>
  </head>
  <body>
    <div id="app" role="status" aria-live="polite"></div>
    <div id="preloader" data-state="loading"></div>
    <div id="boot-loader" aria-hidden="true"><i></i></div>
  </body>
</html>
